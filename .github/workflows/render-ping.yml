# Simulated request to your render project so that the service doesn't go down
name: Render ping

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 14 minutes
  workflow_dispatch:  # Allows manual triggering

jobs:
  curl-website:
    runs-on: ubuntu-latest

    steps:
      - name: Run cURL on Website
        run: curl -I https://ai-exam-preparation-system.onrender.com/
